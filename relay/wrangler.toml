name = "shitstein"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Durable Object that holds per-room state (one instance per room code).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# First migration declares the new DO class. Cloudflare's free tier requires
# SQLite-backed DOs (new_sqlite_classes); our Room is purely in-memory pub/sub
# so the SQLite backing isn't used, but this declaration is required regardless.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
